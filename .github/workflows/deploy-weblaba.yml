name: Deploy to Weblaba staging

on:
  push:
    branches: [main]
    paths:
      - 'wordpress/**'
      - 'src/**'
      - 'public/**'
      - 'preview.html'
      - 'legal.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/deploy-weblaba.mjs'
      - '.github/workflows/deploy-weblaba.yml'
  workflow_dispatch:

concurrency:
  group: deploy-weblaba
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.WEBLABA_SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || (echo "Missing secret WEBLABA_SSH_PRIVATE_KEY" && exit 1)
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/weblaba_deploy
          chmod 600 ~/.ssh/weblaba_deploy
          ssh-keyscan -H server199.hosting.reg.ru >> ~/.ssh/known_hosts

      - name: Build landing + deploy to protransfer.weblaba.ru
        env:
          PT_SSH_HOST: server199.hosting.reg.ru
          PT_SSH_USER: u1396397
          PT_SSH_KEY: ${{ runner.temp }}/unused
        run: |
          export PT_SSH_KEY="$HOME/.ssh/weblaba_deploy"
          npm ci
          npm run deploy:weblaba
