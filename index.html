<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B1422" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Технические работы — Про Трансфер</title>
    <style>
      :root { color-scheme: dark; font-family: Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b1422; color: #f8fafc; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 0%, #1d2e45 0, #0b1422 65%); }
      main { width: min(100%, 560px); text-align: center; }
      .mark { width: 52px; height: 52px; margin: 0 auto 32px; display: grid; place-items: center; border-radius: 16px; background: #e8564a; font-size: 16px; font-weight: 800; }
      .status { display: inline-flex; align-items: center; gap: 9px; color: #f7ada2; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #e8564a; box-shadow: 0 0 16px #e8564a; }
      h1 { margin: 18px 0 12px; font-size: clamp(32px, 8vw, 48px); line-height: 1.1; letter-spacing: -.04em; }
      p { margin: 0; color: #a7b0bf; font-size: 16px; line-height: 1.7; }
      .foot { margin-top: 48px; color: #687487; font-size: 12px; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">ПТ</div>
      <div class="status">Временно недоступен</div>
      <h1>Технические работы</h1>
      <p>Мы временно обновляем сайт. Пожалуйста, загляните позже.</p>
      <div class="foot">Про Трансфер · Крым и Юг России</div>
    </main>
  </body>
</html>
